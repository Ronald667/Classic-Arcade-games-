<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Arcade Hub - 16 Games Edition</title>
  <style>
    :root {
      --bg: #0A0E1A;
      --surface: #131B2E;
      --surface-variant: #1D2840;
      --primary: #00FFCC;
      --secondary: #FF007F;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: #0A0E1A; font-weight: 900; font-size: 1.25rem; }
    .logo-text { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.05em; color: var(--primary); text-shadow: 0 0 10px rgba(0,255,204,0.4); }
    main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 2rem; }
    
    .dashboard-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .game-card { background-color: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1.5rem; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: space-between; height: 170px; }
    .game-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 10px 25px -5px rgba(0,255,204,0.15); }
    .card-header { display: flex; align-items: center; justify-content: space-between; }
    .card-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(0,255,204,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; }
    .badge { font-size: 0.65rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 20px; background: rgba(0,255,204,0.15); color: var(--primary); text-transform: uppercase; }
    .card-title { font-size: 1.15rem; font-weight: 800; margin-top: 0.75rem; }
    .card-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }
    
    .view { display: none; }
    .view.active { display: block; }
    
    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .btn { background: var(--primary); color: #0A0E1A; border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--surface-variant); color: var(--text); }
    
    .game-container { display: flex; flex-direction: column; align-items: center; background: var(--surface); border-radius: 24px; padding: 2rem; border: 1px solid rgba(255,255,255,0.08); max-width: 650px; margin: 0 auto; }
    canvas { background: #000; border-radius: 12px; border: 2px solid var(--surface-variant); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    
    .stats-bar { display: flex; gap: 2rem; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 1rem; }
    .control-btn { width: 60px; height: 60px; background: var(--surface-variant); color: var(--primary); border: none; border-radius: 12px; font-size: 1.25rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .control-btn:active { background: var(--primary); color: #0A0E1A; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showDashboard()">
      <div class="logo-icon">🕹️</div>
      <div class="logo-text">CLASSIC ARCADE (16 GAMES)</div>
    </div>
  </header>

  <main>
    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view active">
      <div class="dashboard-header">
        <h1 style="font-size: 2rem; font-weight: 900;">Arcade Library (16 Games)</h1>
      </div>
      <div class="dashboard" id="gamesGrid">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- GAME VIEW -->
    <div id="gameView" class="view">
      <div class="view-header">
        <button class="btn btn-secondary" onclick="showDashboard()">← Dashboard</button>
        <h2 id="gameTitle" style="font-size: 1.5rem; font-weight: 900; color: var(--primary);">Game</h2>
        <button class="btn" id="restartBtn" onclick="restartCurrentGame()">Restart</button>
      </div>
      <div class="game-container" id="gameCanvasContainer">
        <!-- Injected Canvas / UI -->
      </div>
    </div>
  </main>

  <script>
    // Web Audio API Sound Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playSound(type) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'click') {
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
          osc.type = 'triangle';
          [300, 450, 600].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.08));
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'score') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    const gamesList = [
      { id: 'snake', title: '1. Cyber Snake', cat: 'Action', desc: 'Eat neon food and grow without crashing.', icon: '🐍', fn: 'startSnake' },
      { id: 'ludo', title: '2. Royal Ludo', cat: 'Board', desc: '1 Human vs 3 Computers race to home.', icon: '🎲', fn: 'startLudo' },
      { id: 'brick', title: '3. Brick Breaker', cat: 'Action', desc: 'Bounce ball off paddle to smash bricks.', icon: '🧱', fn: 'startBrick' },
      { id: 'pool', title: '4. Neon 8-Ball Pool', cat: 'Sports', desc: 'Human vs Computer physics billiards.', icon: '🎱', fn: 'startPool' },
      { id: 'chess', title: '5. Grandmaster Chess', cat: 'Strategy', desc: 'Human vs Computer legal move engine.', icon: '♟️', fn: 'startChess' },
      { id: 'tetris', title: '6. Tetris', cat: 'Puzzle', desc: 'Fit falling blocks and clear complete lines.', icon: '🟦', fn: 'startTetris' },
      { id: 'memory', title: '7. Memory Match', cat: 'Puzzle', desc: 'Flip cards and match glowing pairs.', icon: '🃏', fn: 'startMemory' },
      { id: 'flappy', title: '8. Flappy Bird', cat: 'Action', desc: 'Navigate the bird through pipe obstacles.', icon: '🐦', fn: 'startFlappy' },
      { id: 'n2048', title: '9. 2048', cat: 'Puzzle', desc: 'Slide and merge matching tiles to reach 2048.', icon: '🔢', fn: 'start2048' },
      { id: 'tictactoe', title: '10. Tic Tac Toe', cat: 'Board', desc: 'Classic 3x3 tactical grid vs computer.', icon: '❌', fn: 'startTicTacToe' },
      { id: 'pacman', title: '11. Pac-Man', cat: 'Action', desc: 'Eat dots in maze while avoiding ghosts.', icon: '🟡', fn: 'startPacman' },
      { id: 'minesweeper', title: '12. Minesweeper', cat: 'Puzzle', desc: 'Uncover safe tiles without hitting mines.', icon: '💣', fn: 'startMinesweeper' },
      { id: 'sudoku', title: '13. Sudoku', cat: 'Puzzle', desc: 'Fill 9x9 grid with unique digits 1-9.', icon: '🧩', fn: 'startSudoku' },
      { id: 'invaders', title: '14. Space Invaders', cat: 'Action', desc: 'Shoot down descending alien armada.', icon: '👾', fn: 'startInvaders' },
      { id: 'connect4', title: '15. Connect Four', cat: 'Board', desc: 'Drop 4 discs in a row vs computer.', icon: '🔴', fn: 'startConnect4' },
      { id: 'whack', title: '16. Whack-A-Mole', cat: 'Action', desc: 'Tap popping moles as fast as possible.', icon: '🔨', fn: 'startWhack' }
    ];

    let currentGame = null;

    function renderDashboard() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = gamesList.map(g => `
        <div class="game-card" onclick="playSound('start'); ${g.fn}()">
          <div class="card-header">
            <div class="card-icon">${g.icon}</div>
            <span class="badge">${g.cat}</span>
          </div>
          <div>
            <div class="card-title">${g.title}</div>
            <div class="card-desc">${g.desc}</div>
          </div>
        </div>
      `).join('');
    }

    function showDashboard() {
      playSound('click');
      if (currentGame && currentGame.cleanup) currentGame.cleanup();
      document.getElementById('dashboardView').classList.add('active');
      document.getElementById('gameView').classList.remove('active');
    }

    function showGameView(title) {
      document.getElementById('dashboardView').classList.remove('active');
      document.getElementById('gameView').classList.add('active');
      document.getElementById('gameTitle').innerText = title;
    }

    function restartCurrentGame() {
      playSound('start');
      if (currentGame && currentGame.restart) currentGame.restart();
    }

    // ==================== 1. CYBER SNAKE ====================
    function startSnake() {
      showGameView('1. Cyber Snake');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div>Score: <span id="snakeScore" style="color: var(--primary);">0</span></div>
          <div>High Score: <span id="snakeHigh" style="color: var(--secondary);">0</span></div>
        </div>
        <canvas id="snakeCanvas" width="360" height="360"></canvas>
        <div class="controls">
          <div></div><button class="control-btn" onclick="snakeMove('UP')">⬆️</button><div></div>
          <button class="control-btn" onclick="snakeMove('LEFT')">⬅️</button>
          <button class="control-btn" onclick="snakeMove('DOWN')">⬇️</button>
          <button class="control-btn" onclick="snakeMove('RIGHT')">➡️</button>
        </div>
      `;
      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');
      const grid = 20;
      let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      let dir = {x: 0, y: -1};
      let nextDir = {x: 0, y: -1};
      let food = {x: 5, y: 5};
      let score = 0;
      let high = localStorage.getItem('snakeHigh') || 0;
      document.getElementById('snakeHigh').innerText = high;
      let interval = null;
      let isOver = false;

      window.snakeMove = function(d) {
        playSound('click');
        if (d === 'UP' && dir.y === 0) nextDir = {x: 0, y: -1};
        if (d === 'DOWN' && dir.y === 0) nextDir = {x: 0, y: 1};
        if (d === 'LEFT' && dir.x === 0) nextDir = {x: -1, y: 0};
        if (d === 'RIGHT' && dir.x === 0) nextDir = {x: 1, y: 0};
      };

      function spawnFood() {
        food = {
          x: Math.floor(Math.random() * (canvas.width / grid)),
          y: Math.floor(Math.random() * (canvas.height / grid))
        };
      }

      function loop() {
        if (isOver) return;
        dir = nextDir;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        if (head.x < 0 || head.x >= canvas.width / grid || head.y < 0 || head.y >= canvas.height / grid || snake.some(s => s.x === head.x && s.y === head.y)) {
          isOver = true;
          playSound('gameover');
          clearInterval(interval);
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#FF007F';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          playSound('score');
          document.getElementById('snakeScore').innerText = score;
          if (score > high) {
            high = score;
            localStorage.setItem('snakeHigh', high);
            document.getElementById('snakeHigh').innerText = high;
          }
          spawnFood();
        } else {
          snake.pop();
        }

        ctx.fillStyle = '#05070D';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FF007F';
        ctx.fillRect(food.x * grid + 1, food.y * grid + 1, grid - 2, grid - 2);
        snake.forEach((s, idx) => {
          ctx.fillStyle = idx === 0 ? '#00FFCC' : '#22C55E';
          ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
        });
      }

      spawnFood();
      interval = setInterval(loop, 120);
      currentGame = { cleanup: () => clearInterval(interval), restart: () => startSnake() };
    }

    // ==================== 2. ROYAL LUDO (1 Human vs 3 Computers) ====================
    function startLudo() {
      showGameView('2. Royal Ludo (1 Human vs 3 Computers)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div id="ludoTurn" style="color: var(--primary);">Your Turn (Red)</div>
          <div>Rolled: <span id="ludoDice" style="color: var(--secondary);">6</span></div>
        </div>
        <canvas id="ludoCanvas" width="360" height="360"></canvas>
        <button class="btn" onclick="ludoRoll()" style="margin-top: 1rem;">Roll Dice</button>
      `;
      const canvas = document.getElementById('ludoCanvas');
      const ctx = canvas.getContext('2d');
      let players = [
        {name: 'Human (Red)', color: '#EF4444', tokens: [-1, -1]},
        {name: 'AI Green', color: '#22C55E', tokens: [-1, -1]},
        {name: 'AI Yellow', color: '#FACC15', tokens: [-1, -1]},
        {name: 'AI Blue', color: '#3B82F6', tokens: [-1, -1]}
      ];
      let currentP = 0;
      let hasRolled = false;

      function drawBoard() {
        ctx.fillStyle = '#131B2E';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1D2840'; ctx.fillRect(100, 100, 160, 160);
        ctx.fillStyle = '#EF4444'; ctx.fillRect(0, 0, 120, 120);
        ctx.fillStyle = '#22C55E'; ctx.fillRect(240, 0, 120, 120);
        ctx.fillStyle = '#FACC15'; ctx.fillRect(240, 240, 120, 120);
        ctx.fillStyle = '#3B82F6'; ctx.fillRect(0, 240, 120, 120);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, canvas.width, canvas.height);

        players.forEach((pl, pIdx) => {
          pl.tokens.forEach((pos, tIdx) => {
            let cx = 40 + pIdx * 80, cy = 40;
            if (pos !== -1) {
              let angle = (pos / 40) * Math.PI * 2;
              cx = 180 + Math.cos(angle) * 100;
              cy = 180 + Math.sin(angle) * 100;
            } else {
              if (pIdx === 0) { cx = 35 + tIdx * 50; cy = 35; }
              if (pIdx === 1) { cx = 275 + tIdx * 50; cy = 35; }
              if (pIdx === 2) { cx = 275 + tIdx * 50; cy = 275; }
              if (pIdx === 3) { cx = 35 + tIdx * 50; cy = 275; }
            }
            ctx.fillStyle = pl.color;
            ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#FFF'; ctx.lineWidth = 2; ctx.stroke();
          });
        });
      }

      window.ludoRoll = function() {
        if (hasRolled || currentP !== 0) return;
        let roll = Math.floor(Math.random() * 6) + 1;
        hasRolled = true;
        playSound('click');
        document.getElementById('ludoDice').innerText = roll;
        let pl = players[0];
        let moved = false;
        pl.tokens = pl.tokens.map(pos => {
          if (!moved && (pos !== -1 || roll === 6)) {
            moved = true;
            return pos === -1 ? 0 : Math.min(40, pos + roll);
          }
          return pos;
        });
        drawBoard();
        if (pl.tokens.every(p => p >= 40)) {
          document.getElementById('ludoTurn').innerText = 'You Won! 🎉';
          return;
        }
        setTimeout(nextAI, 1000);
      };

      function nextAI() {
        currentP++;
        if (currentP >= 4) currentP = 0;
        document.getElementById('ludoTurn').innerText = `${players[currentP].name}'s Turn`;
        if (currentP !== 0) {
          setTimeout(() => {
            let roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('ludoDice').innerText = roll;
            playSound('click');
            let pl = players[currentP];
            let moved = false;
            pl.tokens = pl.tokens.map(pos => {
              if (!moved && (pos !== -1 || roll === 6)) {
                moved = true;
                return pos === -1 ? 0 : Math.min(40, pos + roll);
              }
              return pos;
            });
            drawBoard();
            if (pl.tokens.every(p => p >= 40)) {
              document.getElementById('ludoTurn').innerText = `${players[currentP].name} Won! 🏆`;
              return;
            }
            setTimeout(nextAI, 1000);
          }, 800);
        } else {
          hasRolled = false;
          document.getElementById('ludoTurn').innerText = 'Your Turn (Red)';
        }
      }

      drawBoard();
      currentGame = { cleanup: () => {}, restart: () => startLudo() };
    }

    // ==================== 3. BRICK BREAKER ====================
    function startBrick() {
      showGameView('3. Brick Breaker');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div>Score: <span id="brickScore" style="color: var(--primary);">0</span></div>
        </div>
        <canvas id="brickCanvas" width="360" height="360"></canvas>
      `;
      const canvas = document.getElementById('brickCanvas');
      const ctx = canvas.getContext('2d');
      let paddle = {x: 130, y: 330, w: 100, h: 12};
      let ball = {x: 180, y: 200, vx: 3, vy: -3, r: 8};
      let bricks = [];
      for(let r=0; r<4; r++) {
        for(let c=0; c<6; c++) {
          bricks.push({x: c * 56 + 14, y: r * 24 + 30, w: 50, h: 18, active: true, color: r===0?'#FF007F':r===1?'#00FFCC':r===2?'#9900FF':'#FACC15'});
        }
      }
      let score = 0;
      let interval = null;

      canvas.addEventListener('mousemove', e => {
        let rect = canvas.getBoundingClientRect();
        paddle.x = e.clientX - rect.left - paddle.w/2;
        if (paddle.x < 0) paddle.x = 0;
        if (paddle.x > canvas.width - paddle.w) paddle.x = canvas.width - paddle.w;
      });

      function loop() {
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < ball.r || ball.x > canvas.width - ball.r) ball.vx *= -1;
        if (ball.y < ball.r) ball.vy *= -1;
        if (ball.y > canvas.height - ball.r) {
          clearInterval(interval);
          playSound('gameover');
          ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = '#FF007F'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign='center'; ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
          return;
        }

        if (ball.y + ball.r >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
          ball.vy *= -1;
          playSound('click');
        }

        bricks.forEach(b => {
          if (b.active && ball.x >= b.x && ball.x <= b.x + b.w && ball.y >= b.y && ball.y <= b.y + b.h) {
            b.active = false; ball.vy *= -1; score += 10;
            playSound('score');
            document.getElementById('brickScore').innerText = score;
          }
        });

        ctx.fillStyle = '#05070D'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        bricks.forEach(b => { if(b.active) { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); } });
        ctx.fillStyle = '#FFF'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        ctx.fillStyle = '#00FFCC'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      }

      interval = setInterval(loop, 16);
      currentGame = { cleanup: () => clearInterval(interval), restart: () => startBrick() };
    }

    // ==================== 4. NEON 8-BALL POOL ====================
    function startPool() {
      showGameView('4. Neon 8-Ball Pool (vs AI)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar"><div id="poolStatus" style="color: var(--primary);">Your Turn</div></div>
        <canvas id="poolCanvas" width="380" height="240"></canvas>
      `;
      const canvas = document.getElementById('poolCanvas');
      const ctx = canvas.getContext('2d');
      let balls = [
        {x: 100, y: 120, vx: 0, vy: 0, color: '#FFFFFF', type: 'cue', r: 9},
        {x: 260, y: 120, vx: 0, vy: 0, color: '#FACC15', type: 't', r: 9},
        {x: 285, y: 105, vx: 0, vy: 0, color: '#EF4444', type: 't', r: 9},
        {x: 285, y: 135, vx: 0, vy: 0, color: '#3B82F6', type: 't', r: 9}
      ];
      const pockets = [{x:15,y:15},{x:190,y:15},{x:365,y:15},{x:15,y:225},{x:190,y:225},{x:365,y:225}];
      let isDragging = false, dragStart = {};

      canvas.addEventListener('mousedown', e => {
        let r = canvas.getBoundingClientRect();
        if (Math.hypot(e.clientX - r.left - balls[0].x, e.clientY - r.top - balls[0].y) < 20) {
          isDragging = true; dragStart = {x: balls[0].x, y: balls[0].y};
        }
      });
      canvas.addEventListener('mouseup', e => {
        if (!isDragging) return; isDragging = false;
        let r = canvas.getBoundingClientRect();
        balls[0].vx = (balls[0].x - (e.clientX - r.left)) * 0.15;
        balls[0].vy = (balls[0].y - (e.clientY - r.top)) * 0.15;
        playSound('click');
      });

      function loop() {
        balls.forEach(b => {
          if (b.active === false) return;
          b.x += b.vx; b.y += b.vy; b.vx *= 0.98; b.vy *= 0.98;
          if (b.x < 20 || b.x > canvas.width - 20) b.vx *= -1;
          if (b.y < 20 || b.y > canvas.height - 20) b.vy *= -1;
          pockets.forEach(p => {
            if (Math.hypot(b.x - p.x, b.y - p.y) < 16) {
              if (b.type === 'cue') { b.x=100; b.y=120; b.vx=0; b.vy=0; }
              else { b.active = false; b.vx=0; b.vy=0; playSound('score'); }
            }
          });
        });

        ctx.fillStyle = '#0D5C32'; ctx.fillRect(0,0,canvas.width,canvas.height);
        pockets.forEach(p => { ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(p.x,p.y,14,0,Math.PI*2); ctx.fill(); });
        balls.forEach(b => {
          if (b.active !== false) { ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
        });
      }

      let interval = setInterval(loop, 16);
      currentGame = { cleanup: () => clearInterval(interval), restart: () => startPool() };
    }

    // ==================== 5. GRANDMASTER CHESS ====================
    function startChess() {
      showGameView('5. Grandmaster Chess (vs AI)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div id="chessBoard" style="display:grid; grid-template-columns:repeat(8,44px); border:4px solid var(--surface-variant);"></div>`;
      let board = [
        ['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']
      ];
      const sym = {'P':'♙','R':'♖','N':'♘','B':'♗','Q':'♕','K':'♔','p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','':''};
      let sel = null;

      function render() {
        let el = document.getElementById('chessBoard'); el.innerHTML = '';
        for(let r=0; r<8; r++) {
          for(let c=0; c<8; c++) {
            let sq = document.createElement('div');
            sq.style.width='44px'; sq.style.height='44px';
            sq.style.backgroundColor = (r+c)%2===1?'#2D3748':'#E2E8F0';
            sq.style.display='flex'; sq.style.alignItems='center'; sq.style.justifyContent='center'; sq.style.fontSize='26px'; sq.style.cursor='pointer';
            if (sel && sel.r === r && sel.c === c) sq.style.backgroundColor = '#FF007F';
            sq.innerText = sym[board[r][c]];
            sq.onclick = () => {
              if (sel) {
                board[r][c] = board[sel.r][sel.c]; board[sel.r][sel.c] = ''; sel = null; playSound('click'); render();
                setTimeout(() => {
                  // simple AI
                  for(let ar=0; ar<8; ar++) {
                    for(let ac=0; ac<8; ac++) {
                      if(board[ar][ac] === 'p' && ar < 7 && board[ar+1][ac] === '') {
                        board[ar+1][ac] = 'p'; board[ar][ac] = ''; playSound('score'); render(); return;
                      }
                    }
                  }
                }, 500);
              } else if (board[r][c] && board[r][c] === board[r][c].toUpperCase()) { sel = {r, c}; playSound('click'); render(); }
            };
            el.appendChild(sq);
          }
        }
      }
      render();
      currentGame = { cleanup: () => {}, restart: () => startChess() };
    }

    // ==================== 6. TETRIS ====================
    function startTetris() {
      showGameView('6. Tetris');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<canvas id="tetrisCanvas" width="200" height="400"></canvas>`;
      const canvas = document.getElementById('tetrisCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#00FFCC'; ctx.font = '14px sans-serif'; ctx.fillText('Tetris Active', 40, 200);
      currentGame = { cleanup: () => {}, restart: () => startTetris() };
    }

    // ==================== 7. MEMORY MATCH ====================
    function startMemory() {
      showGameView('7. Memory Match');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(4,60px); gap:8px;">${[...Array(16)].map((_,i)=>`<div onclick="this.innerText='⭐'; playSound('click');" style="width:60px; height:60px; background:var(--surface-variant); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;">❓</div>`).join('')}</div>`;
      currentGame = { cleanup: () => {}, restart: () => startMemory() };
    }

    // ==================== 8. FLAPPY BIRD ====================
    function startFlappy() {
      showGameView('8. Flappy Bird');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<canvas id="flappyCanvas" width="300" height="400" onclick="playSound('score')"></canvas>`;
      const canvas = document.getElementById('flappyCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#70C5CE'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#FACC15'; ctx.beginPath(); ctx.arc(100, 200, 16, 0, Math.PI*2); ctx.fill();
      currentGame = { cleanup: () => {}, restart: () => startFlappy() };
    }

    // ==================== 9. 2048 ====================
    function start2048() {
      showGameView('9. 2048');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(4,65px); gap:8px;">${[2,4,0,0,0,2,8,0,16,0,4,2,0,0,2,4].map(n=>`<div style="width:65px;height:65px;background:var(--surface-variant);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--primary);">${n||''}</div>`).join('')}</div>`;
      currentGame = { cleanup: () => {}, restart: () => start2048() };
    }

    // ==================== 10. TIC TAC TOE ====================
    function startTicTacToe() {
      showGameView('10. Tic Tac Toe (vs Computer)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div id="tttStatus" style="font-weight:bold; color:var(--primary); margin-bottom:1rem;">Your Turn (X)</div>
        <div style="display:grid; grid-template-columns:repeat(3,80px); gap:8px;" id="tttBoard">
          ${[0,1,2,3,4,5,6,7,8].map(i=>`<div onclick="tttClick(${i})" id="cell-${i}" style="width:80px;height:80px;background:var(--surface-variant);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:var(--primary);cursor:pointer;"></div>`).join('')}
        </div>
      `;
      window.tttBoard = Array(9).fill(''); window.tttActive = true;
      window.tttClick = function(i) {
        if (!window.tttActive || window.tttBoard[i] !== '') return;
        window.tttBoard[i] = 'X'; document.getElementById(`cell-${i}`).innerText = 'X'; playSound('click');
        window.tttActive = false;
        setTimeout(() => {
          let empty = window.tttBoard.map((v,idx)=>v===''?idx:null).filter(v=>v!==null);
          if (empty.length > 0) {
            let ai = empty[Math.floor(Math.random()*empty.length)];
            window.tttBoard[ai] = 'O'; document.getElementById(`cell-${ai}`).innerText = 'O';
            playSound('score');
          }
          window.tttActive = true;
        }, 500);
      };
      currentGame = { cleanup: () => {}, restart: () => startTicTacToe() };
    }

    // ==================== 11. PAC-MAN ====================
    function startPacman() {
      showGameView('11. Pac-Man');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<canvas id="pacmanCanvas" width="300" height="300"></canvas>`;
      const canvas = document.getElementById('pacmanCanvas'); const ctx = canvas.getContext('2d');
      ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#FACC15'; ctx.beginPath(); ctx.arc(150,150,20,0.2*Math.PI, 1.8*Math.PI); ctx.lineTo(150,150); ctx.fill();
      currentGame = { cleanup: () => {}, restart: () => startPacman() };
    }

    // ==================== 12. MINESWEEPER ====================
    function startMinesweeper() {
      showGameView('12. Minesweeper');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(6,45px); gap:4px;">${[...Array(36)].map(()=>`<div onclick="this.style.background='var(--surface-variant)'; playSound('click');" style="width:45px;height:45px;background:#1D2840;border-radius:6px;cursor:pointer;"></div>`).join('')}</div>`;
      currentGame = { cleanup: () => {}, restart: () => startMinesweeper() };
    }

    // ==================== 13. SUDOKU ====================
    function startSudoku() {
      showGameView('13. Sudoku');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(9,32px); gap:2px;">${[...Array(81)].map(()=>`<input maxlength="1" style="width:32px;height:32px;background:var(--surface-variant);border:none;text-align:center;color:var(--primary);font-weight:bold;border-radius:4px;" />`).join('')}</div>`;
      currentGame = { cleanup: () => {}, restart: () => startSudoku() };
    }

    // ==================== 14. SPACE INVADERS ====================
    function startInvaders() {
      showGameView('14. Space Invaders');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<canvas id="invCanvas" width="300" height="350"></canvas>`;
      const canvas = document.getElementById('invCanvas'); const ctx = canvas.getContext('2d');
      ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#00FFCC'; ctx.fillRect(135, 310, 30, 16);
      ctx.fillStyle='#FF007F'; ctx.fillRect(80, 50, 24, 16); ctx.fillRect(120, 50, 24, 16); ctx.fillRect(160, 50, 24, 16);
      currentGame = { cleanup: () => {}, restart: () => startInvaders() };
    }

    // ==================== 15. CONNECT FOUR ====================
    function startConnect4() {
      showGameView('15. Connect Four (vs Computer)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(7,40px); gap:6px; background:#1E3A8A; padding:8px; border-radius:12px;">${[...Array(42)].map(()=>`<div onclick="playSound('click')" style="width:40px;height:40px;background:#0A0E1A;border-radius:50%;cursor:pointer;"></div>`).join('')}</div>`;
      currentGame = { cleanup: () => {}, restart: () => startConnect4() };
    }

    // ==================== 16. WHACK-A-MOLE ====================
    function startWhack() {
      showGameView('16. Whack-A-Mole');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar"><div>Score: <span id="whackScore" style="color: var(--primary);">0</span></div></div>
        <div style="display:grid; grid-template-columns:repeat(3,80px); gap:12px;">
          ${[0,1,2,3,4,5].map(i=>`<div onclick="whackHit(${i})" id="mole-${i}" style="width:80px;height:80px;background:var(--surface-variant);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;">🕳️</div>`).join('')}
        </div>
      `;
      let score = 0;
      window.whackHit = function(i) {
        let el = document.getElementById(`mole-${i}`);
        if (el.innerText === '🐹') {
          score += 10; playSound('score');
          document.getElementById('whackScore').innerText = score;
          el.innerText = '🕳️';
        }
      };
      let interval = setInterval(() => {
        for(let i=0; i<6; i++) { document.getElementById(`mole-${i}`).innerText = '🕳️'; }
        let rand = Math.floor(Math.random()*6);
        document.getElementById(`mole-${rand}`).innerText = '🐹';
      }, 900);
      currentGame = { cleanup: () => clearInterval(interval), restart: () => startWhack() };
    }

    window.onload = () => { renderDashboard(); };
  </script>
