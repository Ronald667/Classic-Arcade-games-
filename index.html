<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Arcade Hub - Offline Edition</title>
  <style>
    :root {
      --bg: #0A0E1A;
      --surface: #131B2E;
      --surface-variant: #1D2840;
      --primary: #00FFCC;
      --secondary: #FF007F;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: var(--surface); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: #0A0E1A; font-weight: 900; font-size: 1.25rem; }
    .logo-text { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.05em; color: var(--primary); text-shadow: 0 0 10px rgba(0,255,204,0.4); }
    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 2rem; }
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
    .game-card { background-color: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1.5rem; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: space-between; height: 180px; }
    .game-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 10px 25px -5px rgba(0,255,204,0.15); }
    .card-header { display: flex; align-items: center; justify-content: space-between; }
    .card-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(0,255,204,0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 20px; background: rgba(0,255,204,0.15); color: var(--primary); text-transform: uppercase; }
    .card-title { font-size: 1.25rem; font-weight: 800; margin-top: 1rem; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    
    .view { display: none; }
    .view.active { display: block; }
    
    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .btn { background: var(--primary); color: #0A0E1A; border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 800; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--surface-variant); color: var(--text); }
    
    .game-container { display: flex; flex-direction: column; align-items: center; background: var(--surface); border-radius: 24px; padding: 2rem; border: 1px solid rgba(255,255,255,0.08); max-width: 600px; margin: 0 auto; }
    canvas { background: #000; border-radius: 12px; border: 2px solid var(--surface-variant); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
    
    .stats-bar { display: flex; gap: 2rem; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; }
    .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 8px; margin-top: 1rem; }
    .control-btn { width: 60px; height: 60px; background: var(--surface-variant); color: var(--primary); border: none; border-radius: 12px; font-size: 1.25rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .control-btn:active { background: var(--primary); color: #0A0E1A; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="showDashboard()">
      <div class="logo-icon">🕹️</div>
      <div class="logo-text">CLASSIC ARCADE</div>
    </div>
  </header>

  <main>
    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view active">
      <h1 style="font-size: 2rem; font-weight: 900; margin-bottom: 1.5rem;">Arcade Dashboard</h1>
      <div class="dashboard">
        <div class="game-card" onclick="startSnake()">
          <div class="card-header">
            <div class="card-icon">🐍</div>
            <span class="badge">Action</span>
          </div>
          <div>
            <div class="card-title">Cyber Snake</div>
            <div class="card-desc">Eat neon food and grow without crashing.</div>
          </div>
        </div>

        <div class="game-card" onclick="startPool()">
          <div class="card-header">
            <div class="card-icon">🎱</div>
            <span class="badge">Sports</span>
          </div>
          <div>
            <div class="card-title">Neon 8-Ball Pool</div>
            <div class="card-desc">Human vs Computer physics billards.</div>
          </div>
        </div>

        <div class="game-card" onclick="startLudo()">
          <div class="card-header">
            <div class="card-icon">🎲</div>
            <span class="badge">Board</span>
          </div>
          <div>
            <div class="card-title">Royal Ludo</div>
            <div class="card-desc">1 Human vs 3 Computer players.</div>
          </div>
        </div>

        <div class="game-card" onclick="startChess()">
          <div class="card-header">
            <div class="card-icon">♟️</div>
            <span class="badge">Strategy</span>
          </div>
          <div>
            <div class="card-title">Grandmaster Chess</div>
            <div class="card-desc">Human vs Computer legal move engine.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- GAME VIEW -->
    <div id="gameView" class="view">
      <div class="view-header">
        <button class="btn btn-secondary" onclick="showDashboard()">← Dashboard</button>
        <h2 id="gameTitle" style="font-size: 1.5rem; font-weight: 900; color: var(--primary);">Game</h2>
        <button class="btn" id="restartBtn" onclick="restartCurrentGame()">Restart</button>
      </div>
      <div class="game-container" id="gameCanvasContainer">
        <!-- Injected Canvas / UI -->
      </div>
    </div>
  </main>

  <script>
    // Web Audio API Sound Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playSound(type) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'click') {
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'start') {
          osc.type = 'triangle';
          [300, 450, 600].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.08));
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'score') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'gameover') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.4);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    let currentGame = null;

    function showDashboard() {
      playSound('click');
      if (currentGame && currentGame.cleanup) currentGame.cleanup();
      document.getElementById('dashboardView').classList.add('active');
      document.getElementById('gameView').classList.remove('active');
    }

    function showGameView(title) {
      document.getElementById('dashboardView').classList.remove('active');
      document.getElementById('gameView').classList.add('active');
      document.getElementById('gameTitle').innerText = title;
    }

    function restartCurrentGame() {
      playSound('start');
      if (currentGame && currentGame.restart) currentGame.restart();
    }

    // ==================== 1. CYBER SNAKE ====================
    function startSnake() {
      playSound('start');
      showGameView('Cyber Snake');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div>Score: <span id="snakeScore" style="color: var(--primary);">0</span></div>
          <div>High Score: <span id="snakeHigh" style="color: var(--secondary);">0</span></div>
        </div>
        <canvas id="snakeCanvas" width="360" height="360"></canvas>
        <div class="controls">
          <div></div>
          <button class="control-btn" onclick="snakeMove('UP')">⬆️</button>
          <div></div>
          <button class="control-btn" onclick="snakeMove('LEFT')">⬅️</button>
          <button class="control-btn" onclick="snakeMove('DOWN')">⬇️</button>
          <button class="control-btn" onclick="snakeMove('RIGHT')">➡️</button>
        </div>
      `;

      const canvas = document.getElementById('snakeCanvas');
      const ctx = canvas.getContext('2d');
      const grid = 20;
      let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      let dir = {x: 0, y: -1};
      let nextDir = {x: 0, y: -1};
      let food = {x: 5, y: 5};
      let score = 0;
      let high = localStorage.getItem('snakeHigh') || 0;
      document.getElementById('snakeHigh').innerText = high;
      let interval = null;
      let isOver = false;

      window.snakeMove = function(d) {
        playSound('click');
        if (d === 'UP' && dir.y === 0) nextDir = {x: 0, y: -1};
        if (d === 'DOWN' && dir.y === 0) nextDir = {x: 0, y: 1};
        if (d === 'LEFT' && dir.x === 0) nextDir = {x: -1, y: 0};
        if (d === 'RIGHT' && dir.x === 0) nextDir = {x: 1, y: 0};
      };

      function spawnFood() {
        food = {
          x: Math.floor(Math.random() * (canvas.width / grid)),
          y: Math.floor(Math.random() * (canvas.height / grid))
        };
      }

      function loop() {
        if (isOver) return;
        dir = nextDir;
        const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

        // Wall collision
        if (head.x < 0 || head.x >= canvas.width / grid || head.y < 0 || head.y >= canvas.height / grid || snake.some(s => s.x === head.x && s.y === head.y)) {
          isOver = true;
          playSound('gameover');
          clearInterval(interval);
          ctx.fillStyle = 'rgba(0,0,0,0.8)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#FF007F';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          playSound('score');
          document.getElementById('snakeScore').innerText = score;
          if (score > high) {
            high = score;
            localStorage.setItem('snakeHigh', high);
            document.getElementById('snakeHigh').innerText = high;
          }
          spawnFood();
        } else {
          snake.pop();
        }

        // Draw
        ctx.fillStyle = '#05070D';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Food
        ctx.fillStyle = '#FF007F';
        ctx.fillRect(food.x * grid + 1, food.y * grid + 1, grid - 2, grid - 2);

        // Snake
        snake.forEach((s, idx) => {
          ctx.fillStyle = idx === 0 ? '#00FFCC' : '#22C55E';
          ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
        });
      }

      spawnFood();
      interval = setInterval(loop, 120);

      currentGame = {
        cleanup: () => clearInterval(interval),
        restart: () => startSnake()
      };
    }

    // ==================== 2. NEON 8-BALL POOL ====================
    function startPool() {
      playSound('start');
      showGameView('Neon 8-Ball Pool (vs AI)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div>Turn: <span id="poolTurn" style="color: var(--primary);">Your Turn</span></div>
          <div>Sunk: <span id="poolSunk" style="color: var(--secondary);">0</span> / 4</div>
        </div>
        <canvas id="poolCanvas" width="400" height="240"></canvas>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem;">Drag and release on cue ball to shoot!</div>
      `;

      const canvas = document.getElementById('poolCanvas');
      const ctx = canvas.getContext('2d');

      let balls = [
        {x: 100, y: 120, vx: 0, vy: 0, color: '#FFFFFF', type: 'cue', radius: 10},
        {x: 280, y: 120, vx: 0, vy: 0, color: '#FACC15', type: 'target', radius: 10},
        {x: 305, y: 105, vx: 0, vy: 0, color: '#EF4444', type: 'target', radius: 10},
        {x: 305, y: 135, vx: 0, vy: 0, color: '#3B82F6', type: 'target', radius: 10},
        {x: 330, y: 90, vx: 0, vy: 0, color: '#9333EA', type: 'target', radius: 10}
      ];

      const pockets = [
        {x: 15, y: 15, r: 18}, {x: 200, y: 15, r: 16}, {x: 385, y: 15, r: 18},
        {x: 15, y: 225, r: 18}, {x: 200, y: 225, r: 16}, {x: 385, y: 225, r: 18}
      ];

      let isDragging = false;
      let dragStart = {x: 0, y: 0};
      let turn = 'player'; // player or ai
      let sunkCount = 0;
      let animId = null;

      canvas.addEventListener('mousedown', e => {
        if (turn !== 'player') return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const cue = balls[0];
        if (Math.hypot(mx - cue.x, my - cue.y) < 25) {
          isDragging = true;
          dragStart = {x: cue.x, y: cue.y};
        }
      });

      canvas.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const cue = balls[0];
        
        ctx.fillStyle = '#0D5C32';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawTable();
        drawBalls();

        // Aim line
        ctx.strokeStyle = '#FACC15';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(cue.x, cue.y);
        ctx.lineTo(cue.x + (cue.x - mx), cue.y + (cue.y - my));
        ctx.stroke();
        ctx.setLineDash([]);
      });

      canvas.addEventListener('mouseup', e => {
        if (!isDragging) return;
        isDragging = false;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const cue = balls[0];
        
        const power = 0.15;
        cue.vx = (cue.x - mx) * power;
        cue.vy = (cue.y - my) * power;
        playSound('click');
        turn = 'moving';
        document.getElementById('poolTurn').innerText = 'Shot Fired...';
      });

      function drawTable() {
        ctx.fillStyle = '#0D5C32';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Border
        ctx.strokeStyle = '#422006';
        ctx.lineWidth = 14;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        // Pockets
        pockets.forEach(p => {
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function drawBalls() {
        balls.forEach(b => {
          if (b.active === false) return;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });
      }

      function updatePhysics() {
        let moving = false;
        balls.forEach(b => {
          if (b.active === false) return;
          b.x += b.vx;
          b.y += b.vy;
          b.vx *= 0.985;
          b.vy *= 0.985;

          if (Math.hypot(b.vx, b.vy) > 0.1) moving = true;
          else { b.vx = 0; b.vy = 0; }

          // Walls
          if (b.x < 22 + b.radius) { b.x = 22 + b.radius; b.vx *= -1; }
          if (b.x > canvas.width - 22 - b.radius) { b.x = canvas.width - 22 - b.radius; b.vx *= -1; }
          if (b.y < 22 + b.radius) { b.y = 22 + b.radius; b.vy *= -1; }
          if (b.y > canvas.height - 22 - b.radius) { b.y = canvas.height - 22 - b.radius; b.vy *= -1; }

          // Pockets
          pockets.forEach(p => {
            if (Math.hypot(b.x - p.x, b.y - p.y) < p.r + 2) {
              if (b.type === 'cue') {
                b.x = 100; b.y = 120; b.vx = 0; b.vy = 0;
                playSound('gameover');
              } else if (b.active !== false) {
                b.active = false;
                b.vx = 0; b.vy = 0;
                sunkCount++;
                playSound('score');
                document.getElementById('poolSunk').innerText = sunkCount;
                if (sunkCount >= 4) {
                  document.getElementById('poolTurn').innerText = 'You Won! 🎉';
                }
              }
            }
          });
        });

        // Ball collisions
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            let b1 = balls[i], b2 = balls[j];
            if (b1.active === false || b2.active === false) continue;
            let dist = Math.hypot(b2.x - b1.x, b2.y - b1.y);
            if (dist < b1.radius + b2.radius) {
              let overlap = (b1.radius + b2.radius - dist) / 2;
              let nx = (b2.x - b1.x) / dist;
              let ny = (b2.y - b1.y) / dist;
              b1.x -= nx * overlap; b1.y -= ny * overlap;
              b2.x += nx * overlap; b2.y += ny * overlap;

              let kx = b1.vx - b2.vx;
              let ky = b1.vy - b2.vy;
              let p = 2 * (nx * kx + ny * ky) / 2;
              b1.vx -= p * nx; b1.vy -= p * ny;
              b2.vx += p * nx; b2.vy += p * ny;
            }
          }
        }

        drawTable();
        drawBalls();

        if (turn === 'moving' && !moving) {
          // Check if AI should take turn
          if (sunkCount < 4) {
            turn = 'ai';
            document.getElementById('poolTurn').innerText = 'Computer Thinking...';
            setTimeout(aiTurn, 1000);
          }
        }

        animId = requestAnimationFrame(updatePhysics);
      }

      function aiTurn() {
        const cue = balls[0];
        const target = balls.find(b => b.type === 'target' && b.active !== false);
        if (target) {
          let angle = Math.atan2(target.y - cue.y, target.x - cue.x);
          cue.vx = Math.cos(angle) * 4.5;
          cue.vy = Math.sin(angle) * 4.5;
          playSound('click');
        }
        turn = 'moving';
        document.getElementById('poolTurn').innerText = 'Your Turn';
      }

      drawTable();
      drawBalls();
      animId = requestAnimationFrame(updatePhysics);

      currentGame = {
        cleanup: () => cancelAnimationFrame(animId),
        restart: () => startPool()
      };
    }

    // ==================== 3. ROYAL LUDO (1 Human vs 3 Computers) ====================
    function startLudo() {
      playSound('start');
      showGameView('Royal Ludo (1 Human vs 3 AI)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div id="ludoTurn" style="color: var(--primary);">Your Turn (Red)</div>
          <div>Rolled: <span id="ludoDice" style="color: var(--secondary);">6</span></div>
        </div>
        <canvas id="ludoCanvas" width="360" height="360"></canvas>
        <button class="btn" id="ludoRollBtn" onclick="ludoRoll()" style="margin-top: 1rem;">Roll Dice</button>
      `;

      const canvas = document.getElementById('ludoCanvas');
      const ctx = canvas.getContext('2d');

      // 4 Players: 0 = Human (Red), 1 = AI1 (Green), 2 = AI2 (Yellow), 3 = AI3 (Blue)
      let players = [
        {name: 'Human (Red)', color: '#EF4444', tokens: [-1, -1]},
        {name: 'AI Green', color: '#22C55E', tokens: [-1, -1]},
        {name: 'AI Yellow', color: '#FACC15', tokens: [-1, -1]},
        {name: 'AI Blue', color: '#3B82F6', tokens: [-1, -1]}
      ];

      let currentP = 0;
      let lastRoll = 6;
      let hasRolled = false;

      function drawBoard() {
        ctx.fillStyle = '#131B2E';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Center base
        ctx.fillStyle = '#1D2840';
        ctx.fillRect(100, 100, 160, 160);

        // 4 corner bases
        ctx.fillStyle = '#EF4444'; ctx.fillRect(0, 0, 120, 120);
        ctx.fillStyle = '#22C55E'; ctx.fillRect(240, 0, 120, 120);
        ctx.fillStyle = '#FACC15'; ctx.fillRect(240, 240, 120, 120);
        ctx.fillStyle = '#3B82F6'; ctx.fillRect(0, 240, 120, 120);

        // Track paths representation
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        // Draw tokens
        players.forEach((pl, pIdx) => {
          pl.tokens.forEach((pos, tIdx) => {
            let cx = 40 + pIdx * 80;
            let cy = 40;
            if (pos !== -1) {
              // Simple path mapping around the board
              let angle = (pos / 40) * Math.PI * 2;
              cx = 180 + Math.cos(angle) * 100;
              cy = 180 + Math.sin(angle) * 100;
            } else {
              if (pIdx === 0) { cx = 35 + tIdx * 50; cy = 35; }
              if (pIdx === 1) { cx = 275 + tIdx * 50; cy = 35; }
              if (pIdx === 2) { cx = 275 + tIdx * 50; cy = 275; }
              if (pIdx === 3) { cx = 35 + tIdx * 50; cy = 275; }
            }
            ctx.fillStyle = pl.color;
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.stroke();
          });
        });
      }

      window.ludoRoll = function() {
        if (hasRolled || currentP !== 0) return;
        lastRoll = Math.floor(Math.random() * 6) + 1;
        hasRolled = true;
        playSound('click');
        document.getElementById('ludoDice').innerText = lastRoll;

        // Human move: move first available token
        let pl = players[0];
        let moved = false;
        pl.tokens = pl.tokens.map(pos => {
          if (!moved && (pos !== -1 || lastRoll === 6)) {
            moved = true;
            return pos === -1 ? 0 : Math.min(40, pos + lastRoll);
          }
          return pos;
        });

        drawBoard();
        if (checkWin(0)) {
          document.getElementById('ludoTurn').innerText = 'You Won! 🎉';
          return;
        }

        setTimeout(nextAITurn, 1000);
      };

      function nextAITurn() {
        currentP++;
        if (currentP >= 4) currentP = 0;
        document.getElementById('ludoTurn').innerText = `${players[currentP].name}'s Turn`;

        if (currentP !== 0) {
          setTimeout(() => {
            let roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('ludoDice').innerText = roll;
            playSound('click');
            let pl = players[currentP];
            let moved = false;
            pl.tokens = pl.tokens.map(pos => {
              if (!moved && (pos !== -1 || roll === 6)) {
                moved = true;
                return pos === -1 ? 0 : Math.min(40, pos + roll);
              }
              return pos;
            });
            drawBoard();
            if (checkWin(currentP)) {
              document.getElementById('ludoTurn').innerText = `${players[currentP].name} Won! 🏆`;
              return;
            }
            setTimeout(nextAITurn, 1000);
          }, 800);
        } else {
          hasRolled = false;
          document.getElementById('ludoTurn').innerText = 'Your Turn (Red)';
        }
      }

      function checkWin(pIdx) {
        return players[pIdx].tokens.every(pos => pos >= 40);
      }

      drawBoard();
      currentGame = {
        cleanup: () => {},
        restart: () => startLudo()
      };
    }

    // ==================== 4. GRANDMASTER CHESS ====================
    function startChess() {
      playSound('start');
      showGameView('Grandmaster Chess (vs AI)');
      const container = document.getElementById('gameCanvasContainer');
      container.innerHTML = `
        <div class="stats-bar">
          <div id="chessStatus" style="color: var(--primary);">Your Turn (White)</div>
        </div>
        <div id="chessBoard" style="display: grid; grid-template-columns: repeat(8, 44px); border: 4px solid var(--surface-variant); border-radius: 8px; overflow: hidden;"></div>
      `;

      let board = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
      ];

      const pieceSymbols = {
        'P':'♙','R':'♖','N':'♘','B':'♗','Q':'♕','K':'♔',
        'p':'♟','r':'♜','n':'♞','b':'♝','q':'♛','k':'♚','':''
      };

      let selected = null;
      let turn = 'white';

      function renderChess() {
        const el = document.getElementById('chessBoard');
        el.innerHTML = '';
        for(let r=0; r<8; r++) {
          for(let c=0; c<8; c++) {
            const sq = document.createElement('div');
            const isDark = (r + c) % 2 === 1;
            sq.style.width = '44px';
            sq.style.height = '44px';
            sq.style.backgroundColor = isDark ? '#2D3748' : '#E2E8F0';
            sq.style.display = 'flex';
            sq.style.alignItems = 'center';
            sq.style.justifyContent = 'center';
            sq.style.fontSize = '26px';
            sq.style.cursor = 'pointer';
            if (selected && selected.r === r && selected.c === c) {
              sq.style.backgroundColor = '#FF007F';
            }
            sq.innerText = pieceSymbols[board[r][c]];
            sq.onclick = () => handleChessClick(r, c);
            el.appendChild(sq);
          }
        }
      }

      function handleChessClick(r, c) {
        if (turn !== 'white') return;
        const p = board[r][c];
        if (selected) {
          // Move
          board[r][c] = board[selected.r][selected.c];
          board[selected.r][selected.c] = '';
          selected = null;
          playSound('click');
          renderChess();
          turn = 'black';
          document.getElementById('chessStatus').innerText = 'Computer Thinking...';
          setTimeout(aiChessMove, 1000);
        } else if (p && p === p.toUpperCase()) {
          selected = {r, c};
          playSound('click');
          renderChess();
        }
      }

      function aiChessMove() {
        // Simple AI: find first black piece and move forward or sideways
        let moves = [];
        for(let r=0; r<8; r++) {
          for(let c=0; c<8; c++) {
            if (board[r][c] && board[r][c] === board[r][c].toLowerCase()) {
              if (r < 7 && board[r+1][c] === '') moves.push({from: {r, c}, to: {r: r+1, c}});
            }
          }
        }
        if (moves.length > 0) {
          let m = moves[Math.floor(Math.random() * moves.length)];
          board[m.to.r][m.to.c] = board[m.from.r][m.from.c];
          board[m.from.r][m.from.c] = '';
          playSound('score');
        }
        turn = 'white';
        document.getElementById('chessStatus').innerText = 'Your Turn (White)';
        renderChess();
      }

      renderChess();
      currentGame = {
        cleanup: () => {},
        restart: () => startChess()
      };
    }
  </script>
